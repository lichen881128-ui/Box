name: Build Custom TVBox APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew and create local.properties
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties


      - name: Build Release APKs with Gradle
        run: ./gradlew assembleArmeabiGenericNormalRelease assembleArm64GenericNormalRelease --no-daemon --stacktrace

      - name: Prepare APKs and Sign
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} release-apks/ \;
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          for f in release-apks/*.apk; do
            echo "Checking signature for $f"
            $BUILD_TOOLS_DIR/apksigner verify -v "$f" || {
              echo "APK is not signed, signing with debug keystore..."
              $BUILD_TOOLS_DIR/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android "$f"
              $BUILD_TOOLS_DIR/apksigner verify -v "$f"
            }
          done
          ls -lh release-apks/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Custom-APKs
          path: release-apks/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: TVBox 专属内置版 (v1.0.0-${{ github.run_number }})
          body: |
            ### 专属于你的 TVBox 电视定制版已构建完成 🎉
            
            - **内置源地址**: `https://cdn.jsdelivr.net/gh/lichen881128-ui/my-tv@main/tvbox.json`
            - **内容包含**:
              - 🎬 **全网影视点播**: 量子、非凡、暴风、索尼多源聚合，首页自动出海报墙与热播推荐
              - 🇨🇳 **央视卫视超清**: CCTV 1-17 全套、4K/8K 专区、全国省市卫视
              - 🇺🇸 **美国主流电视台**: ABC News、CBS、NBC、Bloomberg 彭博、Fox、PBS 等
            - **安装指南**:
              - 下载 `TVBox_release-armeabi-generic-normal.apk`（兼容 99% 的智能电视）或 `TVBox_release-arm64-generic-normal.apk`；
              - 拷入 U 盘插入电视安装，打开即用，无需任何扫码和输入！
          files: release-apks/*.apk
